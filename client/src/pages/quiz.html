<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QMath — Start a Quiz</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles/quiz.css">
</head>

<body>

    <div class="board-wrap">
        <div class="board">

            <a href="/" class="back-link">&larr; Back</a>

            <h1 class="logo">Set Up Your Quiz</h1>
            <p class="tagline">Pick how many questions and what to practice</p>

            <div id="quiz-form" class="quiz-form">

                <div class="field">
                    <label for="count">Number of questions</label>
                    <input type="number" id="count" name="count" min="3" max="50" value="10" required>
                </div>

                <fieldset class="field">
                    <legend>Operations</legend>
                    <div class="checkbox-grid">
                        <label class="check">
                            <input type="checkbox" name="op" value="addition" checked>
                            <span>Addition</span>
                        </label>
                        <label class="check">
                            <input type="checkbox" name="op" value="subtraction" checked>
                            <span>Subtraction</span>
                        </label>
                        <label class="check">
                            <input type="checkbox" name="op" value="multiplication">
                            <span>Multiplication</span>
                        </label>
                        <label class="check">
                            <input type="checkbox" name="op" value="division">
                            <span>Division</span>
                        </label>
                    </div>
                    <p class="hint" id="op-warning" hidden>Pick at least one operation.</p>
                </fieldset>

                <button id="submit" type="submit" class="btn-chalk btn-start">Start</button>

            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/scripts/quiz.js"></script>
</body>

</html>
