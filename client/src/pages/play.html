<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QMath — Quiz</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles/questions.css">
</head>

<body>

    <div class="quiz-page">

        <!-- Question counter, top left -->
        <div class="question-counter" id="question-counter">
            Question 1 / 10
        </div>

        <!-- Wide board with the question -->
        <div class="question-board">
            <p class="question-text" id="question-text">
                3 + 4 = ?
            </p>
        </div>

        <!-- Four choice buttons -->
        <div class="choices" id="choices-box">
            <button class="choice" id="choice-1" type="button"></button>
            <button class="choice" id="choice-2" type="button"></button>
            <button class="choice" id="choice-3" type="button"></button>
            <button class="choice" id="choice-4" type="button"></button>
        </div>

        <!-- Result button -->
        <div class="result-button-wrap", id="result-button">
            <button class="result-button" id="show-result" type="button">Show the result</button>
        </div>

    </div>

</body>

</html>
