<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QMath — Math Games for Kids</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Fredoka:wght@500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/styles/index.css">
</head>
<body>

    <div class="board-wrap">
        <div class="board">
            <h1 class="logo">QMath</h1>

            <p class="tagline">Math games for curious kids</p>

            <p class="about">
                Practise quick <strong>addition</strong>,
                <strong>subtraction</strong>, <strong>times tables</strong>
                and more — with short, fun quizzes that take
                just a minute or two.
            </p>

            <div class="actions">
                <a href="/quiz"   class="btn-chalk btn-quiz">Start a Quiz</a>
                <a href="/login"  class="btn-chalk btn-login">Log In</a>
                <a href="/signup" class="btn-chalk btn-signup">Sign Up</a>
            </div>

            <p class="footnote">
                Sign up to save your scores and track your progress.
            </p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/scripts/index.js"></script>
</body>
</html>
